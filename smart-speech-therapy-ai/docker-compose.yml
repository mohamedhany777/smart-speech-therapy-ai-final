name: smart-speech-therapy-ai

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sst_user
      POSTGRES_PASSWORD: sst_password
      POSTGRES_DB: smart_speech_therapy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sst_user -d smart_speech_therapy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://sst_user:sst_password@postgres:5432/smart_speech_therapy
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_storage:/app/storage
      - backend_qdrant:/app/qdrant_storage

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_storage:
  backend_qdrant:

# --- Notes ---
# This compose file stands up the full app (frontend + backend) against real
# Postgres + Redis. The frontend is served by nginx, which also proxies
# /api/* to the backend container so the SPA can call relative API paths in
# production, matching the Vite dev-server proxy used locally.
# Services from the full original spec not yet built (vector DB, S3/MinIO
# object storage, worker queues) plug in here as they're added — see
# README.md for what's implemented vs. planned.
